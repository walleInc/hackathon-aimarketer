# Прод-стек на сервере. Образ собирается в CI и доставляется по ssh (на сервере всего 1 ГБ RAM).
# Тома pgdata и media сохраняются между деплоями: заменяется только версия приложения.
name: aimarketer

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketer
      POSTGRES_DB: marketer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketer -d marketer"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    networks: [internal]

  app:
    image: aimarketer:${IMAGE_TAG:?не задан IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://marketer:${POSTGRES_PASSWORD}@db:5432/marketer
      MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
    mem_limit: 400m
    networks:
      internal: {}
      aimarketer_net:
        aliases: [aimarketer-app]  # по этому имени до приложения ходит общий Caddy

networks:
  internal: {}
  aimarketer_net:
    external: true

volumes:
  pgdata:
  media:
