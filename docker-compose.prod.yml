# Прод-стек на сервере. Образ собирается в CI и доставляется по ssh (на сервере всего 1 ГБ RAM).
# Тома pgdata и media сохраняются между деплоями: заменяется только версия приложения.
name: aimarketer

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketer
      POSTGRES_DB: marketer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketer -d marketer"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    networks: [internal]

  # Redis: кэш, лимиты, блокировки, состояние диалога, pub/sub и очереди BullMQ.
  # BullMQ требует noeviction: при нехватке памяти Redis откажет в записи, но не удалит задачи.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    networks: [internal]

  app:
    image: aimarketer:${IMAGE_TAG:?не задан IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://marketer:${POSTGRES_PASSWORD}@db:5432/marketer
      MEDIA_DIR: /data/media
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/data/media
    # С российского сервера api.telegram.org по DNS-адресу недоступен; этот адрес Telegram API отвечает.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    mem_limit: 400m
    networks:
      internal: {}
      aimarketer_net:
        aliases: [aimarketer-app]  # по этому имени до приложения ходит общий Caddy

networks:
  internal: {}
  aimarketer_net:
    external: true

volumes:
  pgdata:
  media:
  redisdata:
