openapi: 3.0.3
info:
  title: AI-маркетолог — Core API
  version: 0.1.0
  description: |
    Собрано из backend/app/main.py, routers/client.py, routers/admin.py (30 методов /api + /health + /webhook = 32 маршрута; плюс статика /media/* и /).
    Каждая операция помечена `x-status`:
      - `implemented` — есть в коде;
      - `proposed`    — предложено по ТЗ «Кибер 102» (пункт ТЗ указан в `x-tz`).
    Авторизация: `Authorization: tma <initData>` (dev: `X-Dev-User: <id>`). Админ может выбрать компанию заголовком `X-Company-Id`.
servers:
  - url: http://localhost:8000
security:
  - tma: []
tags:
  - {name: service, description: Служебные}
  - {name: client, description: Клиентское API}
  - {name: admin, description: Админское API (роль admin)}
  - {name: proposed-content, description: Предложено — контент (ТЗ 3.3)}
  - {name: proposed-social, description: Предложено — соцсети и комментарии (ТЗ 3.4)}
  - {name: proposed-analytics, description: Предложено — аналитика (ТЗ 3.6)}
  - {name: proposed-business, description: Предложено — изучение бизнеса (ТЗ 3.2)}
  - {name: proposed-admin, description: Предложено — администрирование, безопасность, LLM}
components:
  securitySchemes:
    tma:
      type: apiKey
      in: header
      name: Authorization
      description: "`tma <initData>` — подпись Telegram Mini App; в dev `X-Dev-User`"
  parameters:
    CompanyId: {name: company_id, in: path, required: true, schema: {type: integer}}
    PostId: {name: post_id, in: path, required: true, schema: {type: integer}}
    TaskId: {name: task_id, in: path, required: true, schema: {type: integer}}
    DocId: {name: doc_id, in: path, required: true, schema: {type: integer}}
    AssetId: {name: asset_id, in: path, required: true, schema: {type: integer}}
    AccountId: {name: account_id, in: path, required: true, schema: {type: integer}}
    Period: {name: period, in: query, schema: {type: string, enum: [7d, 30d, 90d], default: 30d}}
    XCompany: {name: X-Company-Id, in: header, required: false, schema: {type: integer}, description: Только для admin}
  responses:
    Ok: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkOut'}}}}
    NotFound: {description: Не найдено}
    Forbidden: {description: Нет прав}
    Conflict: {description: Недопустимый переход статуса}
    TooMany: {description: Исчерпан лимит (токены/дневной лимит)}
  schemas:
    OkOut: {type: object, properties: {ok: {type: boolean}}}
    IdOut: {type: object, properties: {id: {type: integer}}}
    PostStatus:
      type: string
      enum: [draft, pending_approval, approved, rejected, revision, publishing, published, error]
      description: Точный набор — см. backend/app/workflow.py
    Post:
      type: object
      properties:
        id: {type: integer}
        platform: {type: string}
        text: {type: string}
        image_url: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/PostStatus'}
        version: {type: integer}
        scheduled_at: {type: string, format: date-time, nullable: true}
        error: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        check_notes: {type: string, nullable: true}
    Me:
      type: object
      properties:
        telegram_id: {type: integer}
        role: {type: string, enum: [admin, approver, member]}
        company: {type: object, nullable: true, properties: {id: {type: integer}, name: {type: string}}}
    DecisionIn:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject, revise]}
        comment: {type: string, default: ''}
    TextIn: {type: object, required: [text], properties: {text: {type: string}}}
    AgentOut: {type: object, properties: {reply: {type: string}, post_id: {type: integer, nullable: true}}}
    Task:
      type: object
      properties:
        id: {type: integer}
        prompt: {type: string}
        interval_minutes: {type: integer}
        active: {type: boolean}
        last_run: {type: string, format: date-time, nullable: true}
    TaskIn:
      type: object
      required: [prompt]
      properties:
        prompt: {type: string}
        interval_minutes: {type: integer, default: 1440, minimum: 1}
    CompanyFields:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        brand_style: {type: string}
        brand_rules: {type: string}
        brand_colors: {type: string}
        daily_post_limit: {type: integer, default: 5}
        monthly_token_limit: {type: integer, default: 300000}
    Company:
      allOf:
        - $ref: '#/components/schemas/CompanyFields'
        - {type: object, properties: {id: {type: integer}}}
    KnowledgeIn: {type: object, required: [title, content], properties: {title: {type: string}, content: {type: string}}}
    KnowledgeDoc:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        content: {type: string}
        size: {type: integer}
        updated_at: {type: string, format: date-time}
    Asset:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [logo_color, logo_white, logo_black, icon, pattern, example, font_heading, font_body]}
        filename: {type: string}
        url: {type: string}
    SocialIn:
      type: object
      required: [channel_id]
      properties:
        platform: {type: string, default: telegram, description: "telegram | vk | max (vk, max — proposed)"}
        channel_id: {type: string}
        token: {type: string, description: Пусто = токен основного бота; шифруется Fernet, наружу не отдаётся}
    SocialAccount:
      type: object
      properties:
        id: {type: integer}
        platform: {type: string}
        channel_id: {type: string}
        active: {type: boolean}
    User:
      type: object
      properties:
        id: {type: integer}
        telegram_id: {type: integer}
        name: {type: string}
        role: {type: string}
    Invite:
      type: object
      properties:
        code: {type: string}
        start_param: {type: string}
        deeplink_hint: {type: string}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        company_id: {type: integer}
        user_id: {type: integer}
        action: {type: string}
        details: {type: string}
        created_at: {type: string, format: date-time}

paths:
  # ───────────────────────── Служебные (implemented) ─────────────────────────
  /health:
    get:
      tags: [service]
      summary: Проверка живости
      x-status: implemented
      security: []
      responses: {'200': {description: '{"ok": true}'}}
  /webhook/{secret}:
    post:
      tags: [service]
      summary: Приём обновлений Telegram-бота
      x-status: implemented
      security: []
      parameters: [{name: secret, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, description: Telegram Update}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}, '404': {description: Неверный секрет}}
  /media/{path}:
    get:
      tags: [service]
      summary: Раздача загруженных файлов (картинки, бренд-ассеты) — StaticFiles
      x-status: implemented
      security: []
      parameters: [{name: path, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Файл}}

  # ───────────────────────── Клиентское API (implemented) ─────────────────────────
  /api/me:
    get:
      tags: [client]
      summary: Текущий пользователь и компания
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}, description: OK}}
  /api/posts:
    get:
      tags: [client]
      summary: Список постов компании (до 100, новые сверху)
      x-status: implemented
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/PostStatus'}}]
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Post'}}}}, description: OK}}
  /api/posts/{post_id}:
    parameters: [{$ref: '#/components/parameters/PostId'}]
    get:
      tags: [client]
      summary: Один пост
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}, description: OK}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [client]
      summary: Ручная правка текста (новая версия → повторное согласование)
      x-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TextIn'}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}, description: OK}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/posts/{post_id}/decision:
    post:
      tags: [client]
      summary: Согласование approve/reject/revise (только admin/approver)
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/PostId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionIn'}}}}
      responses:
        '200': {content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}, description: OK}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooMany'}
  /api/agent/message:
    post:
      tags: [client]
      summary: Сообщение AI-агенту (генерация/правка поста)
      x-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TextIn'}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/AgentOut'}}}, description: OK}}
  /api/tasks:
    get:
      tags: [client]
      summary: Регулярные задачи компании
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Task'}}}}, description: OK}}
    post:
      tags: [client]
      summary: Создать регулярную задачу (admin — с X-Company-Id)
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/XCompany'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskIn'}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/IdOut'}}}, description: OK}}

  # ───────────────────────── Админское API (implemented) ─────────────────────────
  /api/admin/companies:
    get:
      tags: [admin]
      summary: Список компаний
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Company'}}}}, description: OK}}
    post:
      tags: [admin]
      summary: Создать компанию
      x-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompanyFields'}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/IdOut'}}}, description: OK}}
  /api/admin/companies/{company_id}:
    parameters: [{$ref: '#/components/parameters/CompanyId'}]
    put:
      tags: [admin]
      summary: Частичное обновление компании
      x-status: implemented
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CompanyFields'}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/admin/stats:
    get:
      tags: [admin]
      summary: Дашборд — посты по статусам, пользователи, каналы, токены (по компаниям)
      x-status: implemented
      responses: {'200': {description: OK}}
  /api/admin/audit:
    get:
      tags: [admin]
      summary: Журнал действий (до 200)
      x-status: implemented
      parameters: [{name: company_id, in: query, schema: {type: integer}}]
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}}}, description: OK}}
  /api/admin/usage:
    get:
      tags: [admin]
      summary: Расход токенов и стоимость по компаниям и типам
      x-status: implemented
      responses: {'200': {description: OK}}
  /api/admin/companies/{company_id}/knowledge:
    parameters: [{$ref: '#/components/parameters/CompanyId'}]
    get:
      tags: [admin]
      summary: Документы базы знаний
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/KnowledgeDoc'}}}}, description: OK}}
    post:
      tags: [admin]
      summary: Добавить документ
      x-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeIn'}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/IdOut'}}}, description: OK}}
  /api/admin/knowledge/{doc_id}:
    parameters: [{$ref: '#/components/parameters/DocId'}]
    put:
      tags: [admin]
      summary: Изменить документ
      x-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeIn'}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}}
    delete:
      tags: [admin]
      summary: Удалить документ
      x-status: implemented
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/admin/companies/{company_id}/files:
    parameters: [{$ref: '#/components/parameters/CompanyId'}]
    get:
      tags: [admin]
      summary: Файлы контекста организации в Yandex S3 (путь {organization_id}/{файл})
      x-status: implemented
      responses: {'200': {description: 'OK: {enabled, files[{name,size,modified,supported}]}'}, '502': {description: Хранилище недоступно}}
    post:
      tags: [admin]
      summary: Загрузить файл контекста (multipart; TXT/MD/CSV/JSON/HTML/PDF/DOCX, ≤10 МБ)
      x-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses: {'200': {description: 'OK: {name,key,size}'}, '400': {description: Недопустимый формат или размер}}
  /api/admin/companies/{company_id}/files/{filename}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {name: filename, in: path, required: true, schema: {type: string}}
    delete:
      tags: [admin]
      summary: Удалить файл контекста
      x-status: implemented
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/admin/queues:
    get:
      tags: [admin]
      summary: Состояние очередей BullMQ (waiting/active/completed/failed/delayed)
      x-status: implemented
      responses: {'200': {description: 'OK: {mode: bullmq|inline, queues: {имя: {состояние: число}}}'}}
  /api/admin/analytics:
    get:
      tags: [admin]
      summary: Почасовая сводка по организациям (публикации, расходы, лимиты)
      x-status: implemented
      responses: {'200': {description: OK}}
  /api/admin/companies/{company_id}/assets:
    parameters: [{$ref: '#/components/parameters/CompanyId'}]
    get:
      tags: [admin]
      summary: Бренд-ассеты
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Asset'}}}}, description: OK}}
    post:
      tags: [admin]
      summary: Загрузить ассет (multipart, ≤15 МБ, проверка типа/изображения)
      x-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: {$ref: '#/components/schemas/Asset/properties/kind'}
                file: {type: string, format: binary}
      responses: {'200': {description: '{id, url}'}, '413': {description: Файл > 15 МБ}, '422': {description: Неверный тип}}
  /api/admin/assets/{asset_id}:
    delete:
      tags: [admin]
      summary: Удалить ассет (файл + запись)
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/admin/companies/{company_id}/brand/preview:
    post:
      tags: [admin]
      summary: Пробная карточка в фирменном стиле
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/CompanyId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                headline: {type: string}
                body: {type: string}
                style: {type: string, enum: [dark, light], default: dark}
      responses: {'200': {description: '{url}'}}
  /api/admin/companies/{company_id}/social:
    parameters: [{$ref: '#/components/parameters/CompanyId'}]
    get:
      tags: [admin]
      summary: Подключённые каналы (без токенов)
      x-status: implemented
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SocialAccount'}}}}, description: OK}}
    post:
      tags: [admin]
      summary: Подключить канал
      x-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialIn'}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/IdOut'}}}, description: OK}}
  /api/admin/social/{account_id}:
    delete:
      tags: [admin]
      summary: Отозвать доступ (деактивация + стирание токена)
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/AccountId'}]
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/admin/companies/{company_id}/users:
    get:
      tags: [admin]
      summary: Сотрудники компании
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/CompanyId'}]
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}, description: OK}}
  /api/admin/companies/{company_id}/posts:
    get:
      tags: [admin]
      summary: Посты компании (до 50)
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/CompanyId'}]
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Post'}}}}, description: OK}}
  /api/admin/companies/{company_id}/invite:
    post:
      tags: [admin]
      summary: Создать инвайт-код
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/CompanyId'}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {role: {type: string, enum: [approver, member], default: approver}}}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/Invite'}}}, description: OK}}
  /api/admin/companies/{company_id}/tasks:
    get:
      tags: [admin]
      summary: Задачи компании
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/CompanyId'}]
      responses: {'200': {content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Task'}}}}, description: OK}}
  /api/admin/tasks/{task_id}:
    patch:
      tags: [admin]
      summary: Вкл/выкл задачу
      x-status: implemented
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}}}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}}

  # ═════════════════════════ ПРЕДЛОЖЕНО ПО ТЗ ═════════════════════════
  # ── 3.1 Диалог и уведомления ──
  /api/agent/history:
    get:
      tags: [proposed-content]
      summary: История диалога с агентом (последние N сообщений)
      x-status: proposed
      x-tz: "3.1 «поддержка диалога с историей», критерий 2"
      parameters: [{name: limit, in: query, schema: {type: integer, default: 50}}]
      responses: {'200': {description: "[{role, text, post_id, created_at}]"}}
    delete:
      tags: [proposed-content]
      summary: Очистить контекст диалога
      x-status: proposed
      x-tz: "3.1"
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/notifications:
    get:
      tags: [proposed-content]
      summary: Лента уведомлений (согласования, ошибки, отчёты, исчерпание бюджета)
      x-status: proposed
      x-tz: "3.1 «Уведомления о выполнении задач, проблемах и согласованиях»"
      responses: {'200': {description: "[{id, kind, text, read, created_at}]"}}
  /api/tasks/{task_id}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    patch:
      tags: [proposed-content]
      summary: Изменить задачу (prompt, интервал, cron, вкл/выкл) — клиентом
      x-status: proposed
      x-tz: "3.1 расписание, 5 «Удобство»"
      requestBody: {content: {application/json: {schema: {type: object, properties: {prompt: {type: string}, interval_minutes: {type: integer}, cron: {type: string}, active: {type: boolean}}}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}}
    delete:
      tags: [proposed-content]
      summary: Удалить задачу
      x-status: proposed
      x-tz: "3.1"
      responses: {'200': {$ref: '#/components/responses/Ok'}}
  /api/tasks/{task_id}/run:
    post:
      tags: [proposed-content]
      summary: Запустить задачу немедленно (для демо «по расписанию»)
      x-status: proposed
      x-tz: "6 (демо автономной задачи), критерий 8"
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses: {'202': {description: Запущено}}
  /api/tasks/{task_id}/runs:
    get:
      tags: [proposed-content]
      summary: История запусков задачи (статус, ошибка, созданный пост)
      x-status: proposed
      x-tz: "5 «Понятные статусы задач»"
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses: {'200': {description: "[{id, started_at, status, error, post_id}]"}}

  # ── 3.2 Изучение бизнеса ──
  /api/admin/companies/{company_id}/knowledge/upload:
    post:
      tags: [proposed-business]
      summary: Загрузка PDF/DOCX/TXT в базу знаний (парсинг + чанки)
      x-status: proposed
      x-tz: "3.2 «из документов», README: не реализовано"
      parameters: [{$ref: '#/components/parameters/CompanyId'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}
      responses: {'200': {content: {application/json: {schema: {$ref: '#/components/schemas/IdOut'}}}, description: OK}}
